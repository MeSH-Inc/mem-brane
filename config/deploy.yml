# Kamal deployment to apps-1 (Hetzner) behind Cloudflare Tunnel.
# Shared server setup, cutover and rollback: ~/apps/selfhost/README.md.
service: mem-brane
image: mem-brane

servers:
  web:
    hosts:
      - apps-1
    options:
      memory: 1g

proxy:
  hosts:
    - mem-brane.com
    - www.mem-brane.com
  app_port: 3001
  # TLS ends at Cloudflare; cloudflared reaches kamal-proxy on localhost:80.
  ssl: false
  forward_headers: true
  # Generation runs stream over SSE for up to RUN_TOTAL_MS (300 s), with pings.
  response_timeout: 330
  buffering:
    responses: false
  healthcheck:
    path: /health

registry:
  server: localhost:5555

builder:
  arch: amd64

env:
  clear:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3001"
    APP_ORIGIN: https://mem-brane.com
    REDIRECT_HOSTS: www.mem-brane.com
    TRUST_PROXY: cloudflare
    DATABASE_PATH: /data/mem-brane.sqlite
    ASSET_DIRECTORY: /data/assets
    SIGNUP_MODE: invite
    MODEL_DEFAULT: deepseek-flash
    MODEL_ALLOWLIST: deepseek-flash
    MAX_OUTPUT_TOKENS: "1024"
    DAILY_USER_SPEND_LIMIT: "1"
    GLOBAL_DAILY_SPEND_LIMIT: "1"
    GLOBAL_MONTHLY_SPEND_LIMIT: "5"
    OCR_PROVIDER: disabled
    SHUTDOWN_MS: "20000"
    # One R2 bucket, one token: hourly bundles under mem-brane/production/,
    # Litestream under litestream/.
    BACKUP_BUCKET: mem-brane-backup
    BACKUP_ENDPOINT: https://edc30d8f8e11aaf6c06393f7b611a7a7.r2.cloudflarestorage.com
    BACKUP_REGION: auto
    LITESTREAM_BUCKET: mem-brane-backup
    LITESTREAM_ENDPOINT: https://edc30d8f8e11aaf6c06393f7b611a7a7.r2.cloudflarestorage.com
  secret:
    - BETTER_AUTH_SECRET
    - SIGNUP_INVITE_CODE
    - DEEPSEEK_API_KEY
    - MODEL_PRICING_JSON
    - BACKUP_ACCESS_KEY_ID
    - BACKUP_SECRET_ACCESS_KEY
    - LITESTREAM_ACCESS_KEY_ID
    - LITESTREAM_SECRET_ACCESS_KEY

volumes:
  - mem-brane-data:/data

ssh:
  user: root

# check-production plus a possible restore from R2 (Railway allowed 120 s).
deploy_timeout: 180
# SHUTDOWN_MS is 20 s.
drain_timeout: 25
